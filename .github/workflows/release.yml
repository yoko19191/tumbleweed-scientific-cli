name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            pkg_target: node22-macos-arm64
          - target: darwin-x64
            pkg_target: node22-macos-x64
          - target: linux-x64
            pkg_target: node22-linux-x64
          - target: linux-arm64
            pkg_target: node22-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build binary
        run: npm exec -- pkg dist/tumbleweed.cjs --target=${{ matrix.pkg_target }} --output=dist/tumbleweed-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tumbleweed-${{ matrix.target }}
          path: dist/tumbleweed-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    name: Publish npm package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install --global npm@11.7.0
      - run: npm ci

      - name: Verify tag matches package version
        run: node -e 'const expected = `v${require("./package.json").version}`; if (process.env.GITHUB_REF_NAME !== expected) { throw new Error(`Expected tag ${expected}, got ${process.env.GITHUB_REF_NAME}`); }'

      - run: npm publish

  release:
    name: Publish GitHub Release
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum tumbleweed-* > checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tumbleweed-*
            dist/checksums-sha256.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
